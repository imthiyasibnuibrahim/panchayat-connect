<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Panchayat Connect | Kerala Local Ecosystem</title>
    
    <!-- PWA Web Manifest & Theme Colors -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#064E3B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PanchayatConnect" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(
            (registration) => {
              registration.update();
              console.log('✅ ServiceWorker registered and updated with scope: ', registration.scope);
            },
            (err) => {
              console.log('❌ ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
